name: Publish USB flasher to Pages
on:
  workflow_run:
    workflows: [Build and regression checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run:
        description: Successful CI run for the current main commit
        required: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Verify CI identity and current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CI_RUN: ${{ github.event.workflow_run.id || inputs.ci_run }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          base='https://api.github.com/repos/'+os.environ['REPOSITORY']
          def get(path):
              request=urllib.request.Request(base+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              return json.load(urllib.request.urlopen(request))
          run=get('/actions/runs/'+str(int(os.environ['CI_RUN'])))
          main=get('/git/ref/heads/main')['object']['sha']
          assert run['conclusion']=='success' and run['name']=='Build and regression checks'
          assert run['event'] in ('push','workflow_dispatch') and run['head_branch']=='main'
          assert run['head_repository']['full_name']==os.environ['REPOSITORY'] and run['head_sha']==main
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-flasher-site
          path: site
          run-id: ${{ github.event.workflow_run.id || inputs.ci_run }}
          github-token: ${{ github.token }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
