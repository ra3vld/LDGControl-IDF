<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>LDG Control</title><link rel="stylesheet" href="/assets/@BUILD@/style.css"></head><body>
<header><a href="#work" class="brand">LDG<span>CONTROL</span></a><span id="connection" role="status">Connecting…</span><nav><a href="#work" data-i18n="work">Control</a><a href="#settings" data-i18n="settings">Settings</a><a href="#service" data-i18n="service">Service</a><button id="language" type="button" aria-label="Switch to Russian">RU</button></nav></header>
<main><section id="work"><div class="section-title"><h1 data-i18n="work">Control</h1><span id="source"></span></div>
<div class="meters"><article><label>FWD <span>W</span></label><strong id="fwd">—</strong><meter id="fwd-meter" max="1000"></meter></article><article><label>REF <span>W</span></label><strong id="ref">—</strong><meter id="ref-meter" max="1000"></meter></article><article><label>SWR</label><strong id="swr">—</strong><span id="band">—</span></article></div>
<div class="state-row"><span id="mode">—</span><span id="antenna">ANT —</span><span id="radio">TCI —</span></div>
<div class="commands"><button data-command="memory_tune">MEM TUNE</button><button data-command="full_tune">FULL TUNE</button><button data-command="antenna_1">ANT 1</button><button data-command="antenna_2">ANT 2</button><button data-command="auto">AUTO</button><button data-command="manual">MANUAL</button><button data-command="controlled">CONTROLLED</button><button data-command="bypass">BYPASS</button></div><p class="action-result" id="command-result" role="status"></p>
<details><summary data-i18n="external">External switch</summary><form id="external-form"><label><span data-i18n="port">Port</span><input name="port" type="number" min="1" max="16" value="1" required></label><button type="submit" data-i18n="select">Select</button><p class="action-result" role="status"></p></form><p id="external-state"></p></details>
<section id="history"><div class="section-title"><h2 data-i18n="history">History · 30 minutes</h2><label><input id="tx-only" type="checkbox"><span data-i18n="txOnly">TX time only</span></label></div><div id="charts-placeholder"><span data-i18n="loadingCharts">Charts are loading in the background…</span><button id="retry-charts" hidden data-i18n="retry">Retry</button></div><canvas id="chart" height="300" hidden></canvas></section></section>
<section id="settings"><h2 data-i18n="settings">Settings</h2><p data-i18n="optional">Configure each feature independently. Unused connections can stay disabled.</p><div id="settings-sections"></div></section>
<section id="service"><h2 data-i18n="service">Service</h2><article><h3 data-i18n="updates">Updates</h3><p id="release-state"></p><button id="check-updates" data-i18n="checkUpdates">Check GitHub</button><div id="release-list"></div><form id="upload-form"><label><span data-i18n="manifest">Release manifest (JSON)</span><input name="manifest" type="file" accept=".json" required></label><label><span data-i18n="firmware">Firmware (.bin)</span><input name="firmware" type="file" accept=".bin" required></label><button type="submit" data-i18n="installFile">Install file</button><p class="action-result" role="status"></p></form><progress id="ota-progress" max="100" value="0" hidden></progress><p id="ota-state" role="status"></p><button id="cancel-update" hidden data-i18n="cancel">Cancel</button></article>
<article><h3 data-i18n="diagnostics">Diagnostics</h3><button id="diagnostics-button" data-i18n="refresh">Refresh</button><dl id="diagnostics"></dl><p class="action-result" role="status"></p></article><article><button id="reconnect-mqtt" data-i18n="mqttReconnect">Reconnect MQTT</button><button id="restart" data-i18n="restart">Restart device</button><p class="action-result" role="status"></p></article></section></main>
<aside id="toast" role="alert" aria-live="assertive" hidden><span></span><button aria-label="Close notification" data-i18n-aria-label="closeNotification">×</button></aside><script type="module" src="/assets/@BUILD@/main.js"></script></body></html>
